# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ Exporters and viewers are covered by GLOB, not by hand. Adding a forked  │
# │ exporter or a new viewer needs NO change here: it lands inside one of    │
# │ the `directories:` patterns below and is picked up on the next run. A    │
# │ new tool directly under scripts/ is the exception — see the entry that   │
# │ lists them, and why it cannot glob.                                      │
# │                                                                          │
# │ No entry here carries a `registries:` key: every npm project resolves    │
# │ from the public registry. The viewers install @museumwnf/<dataset>-data  │
# │ from npmjs, and nothing else consumes a package from GitHub Packages.    │
# │                                                                          │
# │ Dependabot opens ONE PULL REQUEST PER DIRECTORY by default, so a glob    │
# │ does not couple the projects it matches: a failing bump in one exporter  │
# │ does not block the others. Setting `group-by: dependency-name` on a      │
# │ group would collapse them into one PR across directories — don't,        │
# │ unless the PR volume ever becomes the problem.                           │
# └──────────────────────────────────────────────────────────────────────────┘

version: 2
updates:
  - package-ecosystem: "composer" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly" # Check the npm registry for updates every week
    labels:
      - "php"
      - "dependencies"
    groups:
      laravel-dev-dependencies:
        dependency-type: "development"
      laravel-prod-dependencies:
        dependency-type: "production"

  # Root project. No @metanull dependency, so no registry and no PAT.
  - package-ecosystem: "npm"
    directory: "/" # Look for `package.json` and `lock` files in the `root` directory
    schedule:
      interval: "weekly" # Check the npm registry for updates every week
    labels:
      - "npm"
      - "dependencies"
    groups:
      node-dev-dependencies:
        dependency-type: "development"
      node-prod-dependencies:
        dependency-type: "production"

  # Node tooling directly under scripts/ — currently importer and site-i18n.
  #
  # Listed rather than globbed, and this is the one place the glob scheme does
  # not reach. `/scripts/*` here made the WHOLE FILE invalid: Dependabot
  # rejected it with "cannot determine if 'npm' has overlapping directories",
  # because it cannot prove `/scripts/*` disjoint from `/scripts/exporters/*`
  # and `/scripts/viewers/*` below — true though that is, since
  # scripts/exporters and scripts/viewers hold no manifest of their own.
  #
  # An invalid file is not a degraded file: nothing runs at all, composer,
  # bundler, docker and github-actions included. Between #1633 (2026-08-31) and
  # this, no Dependabot pull request of any kind was opened.
  #
  # So a NEW TOOL DIRECTLY UNDER scripts/ needs a line here. Exporters and
  # viewers — the ones that actually multiply, and the reason #1633 introduced
  # globs — keep theirs.
  - package-ecosystem: "npm"
    directories:
      - "/scripts/importer"
      - "/scripts/site-i18n"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      tools-dev-dependencies:
        dependency-type: "development"
      tools-prod-dependencies:
        dependency-type: "production"

  # Dataset exporters. Public npm registry only: exporters read the database and
  # write JSON, they do not consume any @metanull package. Keep this entry free
  # of `registries:` so the PAT is never handed to a job that cannot use it.
  - package-ecosystem: "npm"
    directories:
      - "/scripts/exporters/*"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      exporter-dev-dependencies:
        dependency-type: "development"
      exporter-prod-dependencies:
        dependency-type: "production"

  # Dataset viewers. Public npm registry only: @museumwnf/<dataset>-data is a
  # public package on npmjs, not GitHub Packages, so — like the exporters
  # entry above — this carries no `registries:` key and hands the update job
  # no credential.
  - package-ecosystem: "npm"
    directories:
      - "/scripts/viewers/*"
    schedule:
      interval: "weekly"
    labels:
      - "npm"
      - "dependencies"
    groups:
      viewer-dev-dependencies:
        dependency-type: "development"
      viewer-prod-dependencies:
        dependency-type: "production"

  # The docs site. No Gemfile.lock is committed (it is gitignored), which
  # Dependabot handles: it bumps the requirements in the Gemfile itself.
  #
  # This entry exists because nothing else watches Ruby here. The weekly
  # dependency audit covers Composer and npm only, so the docs gems aged
  # unwatched until an external scanner flagged them.
  - package-ecosystem: "bundler"
    directory: "/docs"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      docs-dependencies:
        patterns:
          - ".*"

  # Base images across .docker/ and scripts/import-tool/. The Ruby base image
  # of the docs container is the thing the scanner actually reported: a gem
  # bump would not have moved it, because the interpreter comes from the FROM
  # line rather than from the Gemfile.
  - package-ecosystem: "docker"
    directories:
      - "/.docker"
      - "/scripts/import-tool"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      docker-base-images:
        patterns:
          - ".*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      github-actions-dependencies:
        patterns:
          - ".*"
