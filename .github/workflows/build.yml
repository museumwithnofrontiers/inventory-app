name: Build

permissions:
  contents: write  # To create releases

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"

  workflow_dispatch:
    # Allow manual triggering

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build and Package Application
    runs-on: ubuntu-latest
    environment: MWNF-SVR
    
    steps:
    - uses: actions/checkout@v7
      with:
        clean: true

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'  # Must match the runtime: .docker/Dockerfile and the VPS both run 8.5
        extensions: fileinfo, zip, sqlite3, pdo_sqlite, gd, exif
        tools: pint
        github-token: ''

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "lts/Krypton"
        cache: "npm"
    
    - name: Install PHP dependencies
      run: |
        composer install --no-dev --no-interaction --optimize-autoloader --no-scripts --prefer-dist

    - name: Publish Filament assets
      run: |
        cp .env.example .env
        php artisan key:generate --force --no-interaction
        php artisan package:discover --ansi
        php artisan filament:assets --no-interaction
        rm -f .env

    - name: Install backend dependencies
      run: |
        npm ci --no-audit --no-fund

    - name: Build backend assets
      run: |
        npm run build

    - name: Validate Build
      run: |
        assetPaths=(
          "public/build"
          "public/css/filament"
          "public/js/filament"
        )
        for path in "${assetPaths[@]}"; do
          if [ -d "$path" ]; then
            echo "  :white_check_mark: Asset path exists: $path"
          else
            echo "::error::Asset path missing: $path"
            exit 1
          fi
        done
      shell: bash

    - name: Create deployment package
      run: |
        # Create deployment package with all production dependencies
        
        echo "::group::Preparing deployment directory"
        deployDir="${{ runner.temp }}/inventory-app"
        echo "DEPLOY_DIR=$deployDir" >> $GITHUB_ENV
        if [ -d "$deployDir" ]; then
          rm -rf "$deployDir"
        fi
        mkdir -p "$deployDir"
        echo "Deployment directory created at $deployDir"
        echo "::endgroup::"
        
        echo "::group::Copying application code"
        appDirs=(
            'app'
            'bootstrap'
            'config'
            'database'
            'public'
            'resources'
            'routes'
            'vendor'
        )
        for dir in "${appDirs[@]}"; do
          if [ -d "$dir" ]; then
            cp -r "$dir" "$deployDir/"
            echo "  :white_check_mark: $dir"
          else
            echo "::error::$dir not found"
            exit 1
          fi
        done
        echo "::endgroup::"
        
        echo "::group::Copying configuration files"
        configFiles=(
          'composer.json'
          'composer.lock'
          'artisan'
          '.env.example'
          'package.json'
          'package-lock.json'
        )
        for file in "${configFiles[@]}"; do
          if [ -f "$file" ]; then
            cp "$file" "$deployDir/"
            echo "  :white_check_mark: $file"
          else
            echo "::error::$file not found"
            exit 1
          fi
        done
        echo "::endgroup::"
        
        echo "::group::Structure application storage directory"
        storageDirs=('storage')
        for dir in "${storageDirs[@]}"; do
          if [ -d "$dir" ]; then
            find "$dir" -type d | while read -r subdir; do
              relativePath="${subdir#$dir/}"
              fullPath="$deployDir/storage/$relativePath"
              if [ ! -d "$fullPath" ]; then
                mkdir -p "$fullPath"
                echo "  :white_check_mark: $relativePath"
              fi
            done
          else
            echo "::error::Error creating $dir structure"
            exit 1
          fi
        done
        echo "::endgroup::"
        
        echo "::group::Creating VERSION file"
          if [ -f "package.json" ]; then
            appVersion=$(jq -r '.version' package.json)
            echo "  :white_check_mark: Version: $appVersion"
          echo "APP_VERSION=$appVersion" >> $GITHUB_ENV
        else
          echo "::error::Error reading version from package.json"
          exit 1
        fi
        buildTimestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        uniqueBuildId="${appVersion}.${GITHUB_RUN_NUMBER}"
        jq -n \
          --arg app_version "$appVersion" \
          --arg commit_sha '${{ github.sha }}' \
          --arg build_timestamp "$buildTimestamp" \
          --arg build_number '${{ github.run_number }}' \
          --arg unique_build_id "$uniqueBuildId" \
          --arg repository '${{ github.repository }}' \
          --arg repository_url '${{ github.server_url }}/${{ github.repository }}' \
          --arg branch '${{ github.ref_name }}' \
          '{app_version: $app_version, commit_sha: $commit_sha, build_timestamp: $build_timestamp, build_number: $build_number, unique_build_id: $unique_build_id, repository: $repository, repository_url: $repository_url, branch: $branch}' \
          > "$deployDir/VERSION"
        echo "  :white_check_mark: VERSION file created"
        echo "::endgroup::"
        
        echo "::group::Creating deployment archives"
        archivePath="${{ runner.temp }}/inventory-app.zip"
        cd "$deployDir"
        zip -r "$archivePath" .
        echo "  :white_check_mark: ZIP archive created at $archivePath"
        echo "PACKAGE_ZIP=$archivePath" >> $GITHUB_ENV

        tarballPath="${{ runner.temp }}/release.tar.gz"
        tar czf "$tarballPath" .
        echo "  :white_check_mark: Tarball created at $tarballPath"
        echo "PACKAGE_TGZ=$tarballPath" >> $GITHUB_ENV
        cd -
        echo "::endgroup::"
      shell: bash

    - name: Generate Tag
      run: |
        tag="${{ env.APP_VERSION }}.${{ github.run_number }}"
        echo "  :white_check_mark: Release tag: $tag"
        echo "RELEASE_TAG=$tag" >> $GITHUB_ENV
      shell: bash

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Release ${{ env.RELEASE_TAG }}
        body: |
          :rocket: **Automated Deployment**
          
          **Version:** ${{ env.APP_VERSION }}
          **Commit:** ${{ github.sha }}
          **Message:** ${{ github.event.head_commit.message }}
          **Author:** ${{ github.actor }}
          **Timestamp:** ${{ github.event.head_commit.timestamp }}
          
          ---
          
          ### :package: Deployment Package
          Download `inventory-app.zip` and extract to your server.
        
          ### :arrows_counterclockwise: Changes:
          ${{ github.event.head_commit.message }}
        files: ${{ env.PACKAGE_ZIP }}
        draft: false
        prerelease: true
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload deployment artifact (OVH)
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ github.sha }}
        path: ${{ env.PACKAGE_TGZ }}
        retention-days: 7

    - name: Done
      run: |
        echo ":white_check_mark: Release created: ${{ env.RELEASE_TAG }}"
      shell: bash