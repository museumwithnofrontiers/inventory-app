name: Deploy to OVH

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build workflow run ID to deploy (leave empty for latest)'
        required: false
        type: string

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to OVH VPS
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: inventory.metanull.eu
      url: https://inventory.metanull.eu

    steps:
      # Resolved before the checkout: deploy.sh must come from the commit the
      # artifact was built from, never from main's HEAD, which a later merge
      # may already have moved on to a script the older release can't run.
      - name: Determine artifact source
        id: source
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.run_id }}" ]]; then
              RUN_ID="${{ inputs.run_id }}"
            else
              # Find the latest successful Build run on main
              RUN_ID=$(gh run list --workflow=build.yml --branch=main --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
              if [[ -z "$RUN_ID" ]]; then
                echo "::error::No successful Build run found on main"
                exit 1
              fi
            fi
            echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
            # Get the head SHA from that run
            HEAD_SHA=$(gh run view "${RUN_ID}" --json headSha --jq '.headSha')
            echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout yet, so gh can't infer the repository from .git
          GH_REPO: ${{ github.repository }}

      - name: Checkout code (for deploy script)
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.head_sha }}

      - name: Download deployment artifact
        uses: actions/download-artifact@v8
        with:
          name: release-${{ steps.source.outputs.head_sha }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact
        run: |
          if [[ ! -f release.tar.gz ]]; then
            echo "::error::release.tar.gz not found in downloaded artifact"
            ls -la
            exit 1
          fi
          echo "Artifact size: $(du -h release.tar.gz | cut -f1)"

      - name: Verify deploy script and artifact share a commit
        env:
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          checkout_sha=$(git rev-parse HEAD)
          artifact_sha=$(tar -xzOf release.tar.gz ./VERSION | jq -r '.commit_sha')
          echo "Build run head: ${HEAD_SHA}"
          echo "Checked out:    ${checkout_sha}"
          echo "Artifact built: ${artifact_sha}"
          if [[ -z "$HEAD_SHA" || "$checkout_sha" != "$HEAD_SHA" || "$artifact_sha" != "$HEAD_SHA" ]]; then
            echo "::error::scripts/deploy.sh and release.tar.gz come from different commits — refusing to deploy"
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check VPS connectivity
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          nc -z -w 10 "$VPS_HOST" 22 || { echo "::error::Cannot reach ${VPS_HOST}:22 — check VPS_HOST and firewall"; exit 1; }

      - name: Verify SSH authentication
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          max_attempts=3
          attempt=1
          while [[ $attempt -le $max_attempts ]]; do
            ssh_output=$(ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" whoami 2>&1)
            ssh_exit=$?
            if [[ $ssh_exit -eq 0 ]]; then
              echo "SSH authentication succeeded as: ${ssh_output}"
              exit 0
            fi

            if echo "$ssh_output" | grep -qi "permission denied\|authentication failed"; then
              echo "::error::SSH auth rejected — check VPS_SSH_KEY and VPS_SSH_USER secrets"
              echo "$ssh_output"
              exit 1
            fi

            echo "Attempt ${attempt}/${max_attempts} failed (transient network issue?): ${ssh_output}"
            if [[ $attempt -lt $max_attempts ]]; then
              sleep $((attempt * 5))
            fi
            attempt=$((attempt + 1))
          done

          echo "::error::SSH connection failed after ${max_attempts} attempts (network/timeout, not an auth rejection) — ${ssh_output}"
          exit 1

      - name: Upload release to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -o ConnectTimeout=30 \
            release.tar.gz "${VPS_USER}@${VPS_HOST}:/tmp/inventory-release.tar.gz"

      - name: Upload deploy script to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -o ConnectTimeout=30 \
            scripts/deploy.sh "${VPS_USER}@${VPS_HOST}:/tmp/inventory-deploy.sh"

      - name: Run deploy script on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 "${VPS_USER}@${VPS_HOST}" \
            'bash /tmp/inventory-deploy.sh /tmp/inventory-release.tar.gz'

      - name: Cleanup
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 \
            "${VPS_USER}@${VPS_HOST}" \
            'rm -f /tmp/inventory-release.tar.gz /tmp/inventory-deploy.sh' || true
