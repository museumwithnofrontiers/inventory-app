name: Dependency Audit (Full Tree)

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

  workflow_dispatch:

concurrency:
  group: dependency-audit
  cancel-in-progress: true

jobs:

  audit-composer:
    name: Audit - Composer (PHP)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: "Setup > Image > Install php"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: fileinfo, intl, zip, sqlite3, pdo_sqlite, gd, exif
          github-token: ""

      - name: "Setup > Composer > Install Dependencies"
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: "Check > Composer > Audit Vulnerabilities"
        run: |
          composer audit

  enumerate-npm-projects:
    name: Enumerate npm Projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.enumerate.outputs.projects }}

    steps:
      - uses: actions/checkout@v7

      # The matrix is derived from the tree: every package.json that is not
      # inside node_modules. .github/dependabot.yml covers the same projects by
      # glob (`/scripts/*`, `/scripts/exporters/*`, `/scripts/viewers/*`), so
      # the two agree because they read the same directories — not because a
      # check compares two hand-written lists. Nothing to keep in sync.
      #
      # Find, do not hand-list. This job used to enumerate Root, SPA and
      # Importer by name and glob only scripts/exporters and scripts/viewers;
      # scripts/site-i18n matched none of those and silently received no audit
      # at all from the day it landed.
      - name: Enumerate npm projects
        id: enumerate
        run: |
          PROJECTS="$(
            {
              [ -f package.json ] && echo "."
              find scripts -name node_modules -prune -o -name package.json -print 2>/dev/null \
                | sed 's|/package\.json$||'
            } | sort -u | jq -R -s -c '
              split("\n") | map(select(length > 0)) | map({
                name: (
                  if   . == "."                        then "Root"
                  elif . == "scripts/importer"         then "Importer"
                  elif . == "scripts/site-i18n"        then "Site i18n"
                  elif startswith("scripts/exporters/") then "Exporter (\(split("/") | last))"
                  elif startswith("scripts/viewers/")   then "Viewer (\(split("/") | last))"
                  else (split("/") | last) end
                ),
                directory: .
              })'
          )"

          echo "$PROJECTS" | jq -r '.[] | "  \(.name) -> \(.directory)"'
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"

  audit-npm:
    name: Audit - npm (${{ matrix.project.name }})
    runs-on: ubuntu-latest
    needs: enumerate-npm-projects

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.enumerate-npm-projects.outputs.projects) }}

    steps:
      - uses: actions/checkout@v7

      - name: "Setup > Node Project"
        uses: ./.github/actions/setup-node-project
        with:
          working-directory: ${{ matrix.project.directory }}

      - name: "Check > npm > Audit Vulnerabilities"
        working-directory: ${{ matrix.project.directory }}
        run: |
          npm audit --audit-level high

  report:
    name: Report Failures
    runs-on: ubuntu-latest
    needs: [audit-composer, enumerate-npm-projects, audit-npm]
    if: always() && (needs.audit-composer.result == 'failure' || needs.enumerate-npm-projects.result == 'failure' || needs.audit-npm.result == 'failure')

    steps:
      - name: Open or update tracking issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Weekly dependency audit found vulnerabilities"
          BODY="The weekly dependency audit found one or more vulnerable dependencies (HIGH severity or above). See the failed jobs in [this run]($RUN_URL) for details, then run \`composer audit\` / \`npm audit\` locally in the affected directory to reproduce."

          EXISTING=$(gh issue list --repo "${{ github.repository }}" --search "\"$TITLE\" in:title" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" --label dependencies
          fi
