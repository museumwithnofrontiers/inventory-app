name: CI

permissions:
  contents: read
  packages: read

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-mandatory-${{ github.ref }}
  cancel-in-progress: true

jobs:

  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      root-frontend: ${{ steps.detect.outputs.root-frontend }}
      importer: ${{ steps.detect.outputs.importer }}
      import-tool-image: ${{ steps.detect.outputs.import-tool-image }}
      site-i18n: ${{ steps.detect.outputs.site-i18n }}
      exporters: ${{ steps.detect.outputs.exporters }}
      exporter-datasets: ${{ steps.exporter-datasets.outputs.datasets }}
      viewers: ${{ steps.detect.outputs.viewers }}
      viewer-datasets: ${{ steps.viewer-datasets.outputs.datasets }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE" HEAD)

          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^(app|routes|config|database|tests|bootstrap)/|^(composer\.json|composer\.lock|phpunit\.xml|artisan)$'; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE '^(resources/css|resources/js|resources/views)/|^(vite\.config\.js|tailwind\.config\.js|postcss\.config\.js|package\.json|package-lock\.json|tsconfig\.json|eslint\.config\.js)$'; then
            echo "root-frontend=true" >> $GITHUB_OUTPUT
          else
            echo "root-frontend=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE '^scripts/importer/'; then
            echo "importer=true" >> $GITHUB_OUTPUT
          else
            echo "importer=false" >> $GITHUB_OUTPUT
          fi

          # Deliberately narrower than the `importer` filter above: only the
          # files that can break `docker build` of the import-tool image.
          # A dependency change is the dangerous one — a native module with no
          # musl prebuild turns `npm ci` into a node-gyp build that alpine
          # cannot satisfy (see #1604). TypeScript changes cannot break it and
          # are already covered by importer-validation, so they must NOT
          # trigger this job.
          if echo "$CHANGED" | grep -qE '^scripts/importer/package(-lock)?\.json$|^scripts/import-tool/(Dockerfile|entrypoint\.sh)$'; then
            echo "import-tool-image=true" >> $GITHUB_OUTPUT
          else
            echo "import-tool-image=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE '^scripts/site-i18n/'; then
            echo "site-i18n=true" >> $GITHUB_OUTPUT
          else
            echo "site-i18n=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE '^scripts/exporters/'; then
            echo "exporters=true" >> $GITHUB_OUTPUT
          else
            echo "exporters=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE '^scripts/viewers/'; then
            echo "viewers=true" >> $GITHUB_OUTPUT
          else
            echo "viewers=false" >> $GITHUB_OUTPUT
          fi

      # Derived from the checkout instead of hardcoded: new datasets are created
      # by forking an existing exporter, and a hardcoded matrix would leave a
      # fork untested while the job still reported green.
      - name: Enumerate exporter datasets
        id: exporter-datasets
        run: |
          DATASETS=$(find scripts/exporters -mindepth 2 -maxdepth 2 -name package.json -printf '%h\n' \
            | xargs -r -n 1 basename \
            | sort \
            | jq -Rsc 'split("\n") | map(select(length > 0))')

          echo "Exporter datasets: $DATASETS"
          echo "datasets=$DATASETS" >> $GITHUB_OUTPUT

      # Same reasoning as the exporters above: viewers are created by forking an
      # existing one, so the matrix is derived from the checkout rather than
      # hardcoded.
      - name: Enumerate viewer datasets
        id: viewer-datasets
        run: |
          DATASETS=$(find scripts/viewers -mindepth 2 -maxdepth 2 -name package.json -printf '%h\n' \
            | xargs -r -n 1 basename \
            | sort \
            | jq -Rsc 'split("\n") | map(select(length > 0))')

          echo "Viewer datasets: $DATASETS"
          echo "datasets=$DATASETS" >> $GITHUB_OUTPUT

  dependency-review:
    name: Dependency Review (PR)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: "Check > Dependency Review > Fail on new CRITICAL/HIGH severity dependencies"
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  backend-lint:
    name: Backend Linting and Validation
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - uses: actions/checkout@v7

      - name: "Setup > Backend"
        uses: ./.github/actions/setup-backend
        with:
          tools: pint

      - name: "Check > Composer > Check requirements"
        run: |
          composer check-platform-reqs

      - name: "Check > Laravel > Linting"
        run: |
          ./vendor/bin/pint --bail

  backend-tests:
    name: Backend Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    strategy:
      fail-fast: true
      matrix:
        suite:
          - Unit
          - Api
          - Web
          - Filament
          - Configuration
          - Console
          - Event
          - Integration

    steps:
      - uses: actions/checkout@v7

      - name: "Setup > Backend"
        uses: ./.github/actions/setup-backend
        with:
          tools: phpunit, pest
          coverage: xdebug

      - name: "Check > Laravel > Run ${{ matrix.suite }} Tests"
        run: |
          php artisan test --testsuite=${{ matrix.suite }} --coverage --parallel --no-ansi --stop-on-failure

  backend-rendered-frontend-validation:
    name: Backend Rendered Frontend Validation (Blade/Tailwind)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.root-frontend == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: "Setup > Node Project"
        uses: ./.github/actions/setup-node-project

      - name: "Check > npm > Build Backend Assets"
        run: |
          npm run build

  importer-validation:
    name: Importer Validation (TypeScript)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.importer == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: "Setup > Node Project (Importer)"
        uses: ./.github/actions/setup-node-project
        with:
          working-directory: scripts/importer

      - name: "Check > npm > Build (Importer)"
        working-directory: scripts/importer
        run: |
          npm run build

      - name: "Check > npm > Run Tests (Importer)"
        working-directory: scripts/importer
        run: |
          npm test

  import-tool-image:
    name: Import Tool Image Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.import-tool-image == 'true'

    # importer-validation runs `npm ci` on the GitHub runner, which has a full
    # build toolchain. The import-tool image does not: it is Alpine-based
    # (see the FROM line in scripts/import-tool/Dockerfile), so a dependency
    # without a musl prebuild fails there and nowhere else. That is how
    # #1598 shipped a broken `stage` image through a green CI.
    #
    # Builds only. Nothing is pushed and nothing is tagged for a registry:
    # the workflow's `permissions:` block grants `packages: read`, so this job
    # could not publish to GHCR even if a `--push` were added by mistake.
    steps:
      - uses: actions/checkout@v7

      - name: "Check > docker > Build import-tool image"
        run: |
          docker build --load -t import-tool:ci -f scripts/import-tool/Dockerfile .

      - name: "Check > docker > Smoke test the importer CLI"
        # Proves the image starts and tsx can load the importer's dependency
        # graph — not merely that the layers assembled. Needs no database:
        # --help parses argv and exits before any connection is opened.
        run: |
          docker run --rm --entrypoint sh import-tool:ci \
            -c "cd /opt/import-tool/importer && npx tsx src/cli/import.ts import --help"

  site-i18n-validation:
    name: Site i18n Validation (TypeScript)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.site-i18n == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: "Setup > Node Project (Site i18n)"
        uses: ./.github/actions/setup-node-project
        with:
          working-directory: scripts/site-i18n

      - name: "Check > npm > Linting (Site i18n)"
        working-directory: scripts/site-i18n
        run: |
          npm run lint:check

      - name: "Check > npm > Build (Site i18n)"
        working-directory: scripts/site-i18n
        run: |
          npm run build

      # Every test in this suite is a pure function over legacy row shapes, so
      # no database, no VPN and no credentials are involved.
      - name: "Check > npm > Run Tests (Site i18n)"
        working-directory: scripts/site-i18n
        run: |
          npm test

  exporter-validation:
    name: Exporter Validation (${{ matrix.dataset }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.exporters == 'true'

    strategy:
      fail-fast: false
      matrix:
        dataset: ${{ fromJSON(needs.detect-changes.outputs.exporter-datasets) }}

    steps:
      - uses: actions/checkout@v7

      - name: "Setup > Node Project (Exporter ${{ matrix.dataset }})"
        uses: ./.github/actions/setup-node-project
        with:
          working-directory: scripts/exporters/${{ matrix.dataset }}

      - name: "Check > npm > Type Check (Exporter ${{ matrix.dataset }})"
        working-directory: scripts/exporters/${{ matrix.dataset }}
        run: |
          npm run type-check

      - name: "Check > npm > Linting (Exporter ${{ matrix.dataset }})"
        working-directory: scripts/exporters/${{ matrix.dataset }}
        run: |
          npm run lint:check

      # Every test in these suites is a pure function over legacy row shapes, so
      # no database, no VPN and no credentials are involved.
      - name: "Check > npm > Run Tests (Exporter ${{ matrix.dataset }})"
        working-directory: scripts/exporters/${{ matrix.dataset }}
        run: |
          npm test

  viewer-validation:
    name: Viewer Validation (${{ matrix.viewer }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.viewers == 'true'

    strategy:
      fail-fast: false
      matrix:
        viewer: ${{ fromJSON(needs.detect-changes.outputs.viewer-datasets) }}

    steps:
      - uses: actions/checkout@v7

      # Every viewer's data package (@museumwnf/<site>-data) is public on
      # npmjs, so this job needs no registry or token — the default public
      # registry resolves it like any other dependency.
      - name: "Setup > Node Project (Viewer ${{ matrix.viewer }})"
        uses: ./.github/actions/setup-node-project
        with:
          working-directory: scripts/viewers/${{ matrix.viewer }}

      # Same base path the deploy workflow uses, so what CI builds is what OVH
      # gets. A viewer whose @museumwnf/<site>-data package is not published
      # fails here, and that is the point: without the package its
      # `@inventory-data` alias cannot resolve, so it cannot be deployed either.
      # A failing check is the honest signal — publish the package (see the
      # exporter's NPM_PUBLISH.md) rather than teach this job to skip.
      - name: "Check > npm > Build (Viewer ${{ matrix.viewer }})"
        working-directory: scripts/viewers/${{ matrix.viewer }}
        run: |
          npm run build -- --base=/${{ matrix.viewer }}/

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - dependency-review
      - backend-lint
      - backend-tests
      - backend-rendered-frontend-validation
      - importer-validation
      - import-tool-image
      - site-i18n-validation
      - exporter-validation
      - viewer-validation
    if: always()

    steps:
      - name: Check all mandatory checks passed
        run: |
          depReviewResult="${{ needs.dependency-review.result }}"

          backendChanged="${{ needs.detect-changes.outputs.backend }}"
          rootFrontendChanged="${{ needs.detect-changes.outputs.root-frontend }}"
          importerChanged="${{ needs.detect-changes.outputs.importer }}"
          importToolImageChanged="${{ needs.detect-changes.outputs.import-tool-image }}"
          siteI18nChanged="${{ needs.detect-changes.outputs.site-i18n }}"
          exportersChanged="${{ needs.detect-changes.outputs.exporters }}"
          viewersChanged="${{ needs.detect-changes.outputs.viewers }}"

          lintResult="${{ needs.backend-lint.result }}"
          testsResult="${{ needs.backend-tests.result }}"
          rootFrontendResult="${{ needs.backend-rendered-frontend-validation.result }}"
          importerResult="${{ needs.importer-validation.result }}"
          importToolImageResult="${{ needs.import-tool-image.result }}"
          siteI18nResult="${{ needs.site-i18n-validation.result }}"
          exportersResult="${{ needs.exporter-validation.result }}"
          viewersResult="${{ needs.viewer-validation.result }}"

          fail=0

          if [ "$depReviewResult" != "success" ]; then
            echo "Dependency review failed (result: $depReviewResult)"
            fail=1
          fi

          if [ "$backendChanged" = "true" ]; then
            if [ "$lintResult" != "success" ]; then
              echo "Backend linting failed or was not run (result: $lintResult)"
              fail=1
            fi
            if [ "$testsResult" != "success" ]; then
              echo "Backend tests failed or were not run (result: $testsResult)"
              fail=1
            fi
          fi

          if [ "$rootFrontendChanged" = "true" ] && [ "$rootFrontendResult" != "success" ]; then
            echo "Backend rendered frontend validation failed or was not run (result: $rootFrontendResult)"
            fail=1
          fi

          if [ "$importerChanged" = "true" ] && [ "$importerResult" != "success" ]; then
            echo "Importer validation failed or was not run (result: $importerResult)"
            fail=1
          fi

          if [ "$importToolImageChanged" = "true" ] && [ "$importToolImageResult" != "success" ]; then
            echo "Import tool image build failed or was not run (result: $importToolImageResult)"
            fail=1
          fi

          if [ "$siteI18nChanged" = "true" ] && [ "$siteI18nResult" != "success" ]; then
            echo "Site i18n validation failed or was not run (result: $siteI18nResult)"
            fail=1
          fi

          if [ "$exportersChanged" = "true" ] && [ "$exportersResult" != "success" ]; then
            echo "Exporter validation failed or was not run (result: $exportersResult)"
            fail=1
          fi

          if [ "$viewersChanged" = "true" ] && [ "$viewersResult" != "success" ]; then
            echo "Viewer validation failed or was not run (result: $viewersResult)"
            fail=1
          fi

          if [ "$fail" = "1" ]; then
            exit 1
          fi

          echo "All mandatory checks passed"
